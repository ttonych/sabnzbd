name: Build Windows x64 zip (manual, master only)

on:
  workflow_dispatch:

env:
  PYTHONNODEBUGRANGES: 1

jobs:
  build_win64_zip:
    # Даже если workflow_dispatch запустят не на master — job не выполнится
    if: github.ref == 'refs/heads/master'
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Safety check (no upstream remote)
        run: |
          git remote -v
          if (git remote -v | Select-String -Pattern "github.com/sabnzbd/sabnzbd") { throw "ERROR: upstream remote detected!" }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            builder/requirements.txt

      - name: Install Python dependencies
        run: |
          python --version
          python -m pip install --upgrade pip wheel
          pip install --upgrade -r requirements.txt --no-dependencies
          pip install --upgrade -r builder/requirements.txt --no-dependencies

      - name: Build Windows standalone binary (zip)
        run: python builder/package.py binary

      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: sabnzbd-win64-bin
          path: "*-win64-bin.zip"
          if-no-files-found: error
